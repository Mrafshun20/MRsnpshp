name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore and patch clean logic.py and main.py
        run: |
          python3 -c "import base64; exec(base64.b64decode('').decode('utf-8'))"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache project .buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}-${{ github.sha }}
          restore-keys: |
            buildozer-local-${{ hashFiles('buildozer.spec') }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake libltdl-dev

      - name: Install Python build tools
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" wheel "setuptools<70" buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug 2>&1 | tee build.log
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Show build failure details
        if: failure()
        run: |
          echo "=========== MATCHING ERROR LINES ==========="
          grep -n -iE "error|failed|not found|exception" build.log | tail -n 40 || true
          echo "=========== LAST LINES ==========="
          tail -n 50 build.log || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snappshop-apk
          path: bin/*.apk
