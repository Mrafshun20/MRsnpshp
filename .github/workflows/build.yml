name: Build APK
on:
  push:
    branches: [ main, master, ui-modern ]
    paths-ignore: [ "build_windows.py", ".github/workflows/windows-build.yml", "README.txt" ]
  workflow_dispatch:
# Variant suffix: the ui-modern branch publishes SnappShop-light.apk next to
# the main SnappShop.apk in the same "latest" release, so both stay installed side by side.
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile check and unit tests
        run: |
          python -m py_compile main.py logic.py core.py bot.py
          python -m unittest discover -s tests
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip buildozer cython virtualenv setuptools
      - name: Build
        run: |
          set +e
          buildozer -v android debug > build.log 2>&1
          echo $? > code.txt
          exit 0
      - name: Show errors
        run: |
          grep -n -iE "error|failed|not found|exception" build.log | tail -n 40 || true
          echo "=========== LAST LINES ==========="
          tail -n 40 build.log
          test "$(cat code.txt)" = "0"
      - name: Set variant suffix
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "ui-modern" ]; then
            echo "suffix=-light" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi
      - name: Rename APK
        run: cp bin/*.apk "SnappShop${{ steps.vars.outputs.suffix }}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "SnappShop-APK${{ steps.vars.outputs.suffix }}"
          path: "SnappShop${{ steps.vars.outputs.suffix }}.apk"
      - name: Upload build log (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Publish APK to Releases (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: "SnappShop${{ steps.vars.outputs.suffix }}.apk"
