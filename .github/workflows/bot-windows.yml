name: Build Windows Bot
on:
  workflow_dispatch:
  push:
    paths: [ "bot.py", "core.py", "logic.py", ".github/workflows/bot-windows.yml" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --console --name SnappShopBot bot.py
      - name: Self-test (must not hang)
        run: dist\SnappShopBot.exe --help
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        with:
          name: SnappShopBot-exe
          path: dist/SnappShopBot.exe
      - name: Publish EXE to Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: dist/SnappShopBot.exe
