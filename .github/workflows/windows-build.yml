name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix imports and Windows header
      run: |
        python -c "import pathlib; p = pathlib.Path('main.py'); m = p.read_text('utf-8'); h = '# -*- coding: utf-8 -*-\nimport csv, datetime, json, logging, ntpath, os, re, shutil, site, sys, threading, time\nfrom concurrent.futures import ThreadPoolExecutor\nfrom logging.handlers import RotatingFileHandler\nfrom typing import Any, Dict, List, Optional, Tuple, Union\nimport requests\n_HERE0 = getattr(sys, \"_MEIPASS\", os.path.dirname(os.path.abspath(__file__)))\nif sys.stdout is None: sys.stdout = open(os.devnull, \"w\")\nif sys.stderr is None: sys.stderr = open(os.devnull, \"w\")\nos.environ.setdefault(\"KIVY_NO_CONSOLELOG\", \"1\")\nif os.name == \"nt\":\n    if getattr(site, \"USER_BASE\", None) is None: site.USER_BASE = _HERE0\n    if getattr(site, \"USER_SITE\", None) is None: site.USER_SITE = _HERE0\n    _oj = ntpath.join\n    ntpath.join = os.path.join = lambda a, *q: _oj(a if a is not None else _HERE0, *[x for x in q if x is not None])\n    if hasattr(os, \"add_dll_directory\"):\n        for _d in (\"\", \"share\\\\sdl2\\\\bin\", \"share\\\\glew\\\\bin\", \"share\\\\angle\\\\bin\"):\n            _p = _oj(_HERE0, _d) if _d else _HERE0\n            if os.path.isdir(_p):\n                try: os.add_dll_directory(_p)\n                except Exception: pass\n'; i = m.find('from kivy.app import App'); m = (h + m[i:] if i != -1 else h + m).replace('from typing import Any, Dict, List\n', 'from typing import Any, Dict, List, Optional\n'); p.write_text(m, 'utf-8'); import py_compile; py_compile.compile('main.py', doraise=True); print('OK')"

    - name: Commit fixed main.py
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add main.py
        git diff --staged --quiet || git commit -m "Fix Optional and logging imports in main.py"
        git push || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy==2.3.0 kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle requests urllib3 idna charset-normalizer certifi arabic-reshaper python-bidi==0.4.2 future pyinstaller

    - name: Build EXE with PyInstaller
      env:
        KIVY_GL_BACKEND: angle_sdl2
        KIVY_NO_CONSOLELOG: 1
      run: |
        python -c "import sys, os, PyInstaller.__main__, kivy_deps.sdl2, kivy_deps.glew, kivy_deps.angle; share = os.path.join(sys.prefix, 'share'); bins = [f'--add-binary={p};.' for p in (kivy_deps.sdl2.dep_bins + kivy_deps.glew.dep_bins + kivy_deps.angle.dep_bins) if os.path.isdir(p)]; PyInstaller.__main__.run(['--noconfirm', '--onefile', '--windowed', '--add-data=DejaVuSans.ttf;.', '--add-data=DejaVuSans-Bold.ttf;.', f'--add-data={share};share', *bins, '--hidden-import=logic', '--hidden-import=core', '--hidden-import=bot', '--hidden-import=kivy_deps.sdl2', '--hidden-import=kivy_deps.glew', '--hidden-import=kivy_deps.angle', 'main.py'])"

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SnappShop-Windows-App
        path: dist/main.exe
