name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Unify files, clean UI logs, and localize Excel headers
      shell: python
      run: |
        import ast, os, re, sys, pathlib, py_compile

        # --- 1. Patch bot.py ---
        p_bot = pathlib.Path("bot.py")
        if p_bot.exists():
            b = p_bot.read_text(encoding="utf-8").replace("\r\n", "\n")
            if "SNAPP_BOT_DIR" not in b:
                b = b.replace(
                    'APP_DIR = os.path.dirname(sys.executable) if FROZEN else os.path.dirname(os.path.abspath(__file__))',
                    'APP_DIR = os.environ.get("SNAPP_BOT_DIR") or (os.path.dirname(sys.executable) if FROZEN else os.path.dirname(os.path.abspath(__file__)))',
                    1
                )
            if "import threading" not in b:
                b = "import threading\n" + b
            if "self.stop_ev" not in b:
                b = b.replace(
                    "        self.cfg_mtime = os.path.getmtime(CFG) if os.path.exists(CFG) else 0\n",
                    "        self.cfg_mtime = os.path.getmtime(CFG) if os.path.exists(CFG) else 0\n        self.stop_ev = threading.Event()\n\n    def stop(self):\n        self.stop_ev.set()\n",
                    1
                )
                b = b.replace(
                    "            time.sleep(10)\n            self.reload_cfg()",
                    "            if self.stop_ev.wait(10):\n                log.info('ربات متوقف شد.')\n                return 0\n            self.reload_cfg()",
                    1
                )
                b = b.replace(
                    "        while True:\n            now = time.monotonic()",
                    "        while not self.stop_ev.is_set():\n            now = time.monotonic()",
                    1
                )
            if "--minimized" not in b:
                b = b.replace(
                    '    cmd = (f\'cmd /c start "" /min "{sys.executable}"\' if FROZEN',
                    '    cmd = (f\'cmd /c start "" /min "{sys.executable}" --minimized\' if FROZEN',
                    1
                )
                b = b.replace(
                    '    ap.add_argument("--uninstall-startup", action="store_true")',
                    '    ap.add_argument("--uninstall-startup", action="store_true")\n    ap.add_argument("--minimized", action="store_true", help=argparse.SUPPRESS)',
                    1
                )
            for old_list in (
                '["variant_id", "product_title", "variant_title", "stock", "price", "special_price", "snappshop_discount"]',
                '["کد تنوع (غیرقابل تغییر)", "نام محصول", "تنوع / ویژگی", "موجودی", "قیمت پایه (تومان)", "قیمت با تخفیف (تومان)", "تخفیف اسنپ‌شاپ"]'
            ):
                b = b.replace(
                    old_list,
                    '["کد تنوع", "نام محصول", "تنوع / ویژگی", "موجودی", "قیمت پایه (تومان)", "قیمت با تخفیف (تومان)", "تخفیف اسنپ‌شاپ"]'
                )
            if 'r.get("کد تنوع")' not in b:
                b = b.replace(
                    'r.get("variant_id")',
                    '(r.get("variant_id") or r.get("کد تنوع") or r.get("کد تنوع (غیرقابل تغییر)") or r.get("کد محصول"))'
                )
                b = b.replace(
                    'r.get("stock")',
                    '(r.get("stock") if r.get("stock") not in (None, "") else r.get("موجودی"))'
                )
                b = b.replace(
                    'r.get("price")',
                    '(r.get("price") if r.get("price") not in (None, "") else r.get("قیمت پایه (تومان)"))'
                )
                b = b.replace(
                    'r.get("special_price")',
                    '(r.get("special_price") if r.get("special_price") not in (None, "") else r.get("قیمت با تخفیف (تومان)"))'
                )
            ast.parse(b)
            p_bot.write_text(b, encoding="utf-8")

        # --- 2. Patch main.py ---
        p_main = pathlib.Path("main.py")
        m = p_main.read_text(encoding="utf-8").replace("\r\n", "\n")

        header = "\n".join([
            "# -*- coding: utf-8 -*-",
            "import csv, datetime, json, logging, ntpath, os, re, shutil, site, sys, threading, time",
            "from concurrent.futures import ThreadPoolExecutor",
            "from logging.handlers import RotatingFileHandler",
            "from typing import Any, Dict, List, Optional, Tuple, Union",
            "import requests",
            "_HERE0 = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))",
            "if sys.stdout is None: sys.stdout = open(os.devnull, 'w')",
            "if sys.stderr is None: sys.stderr = open(os.devnull, 'w')",
            "os.environ.setdefault('KIVY_NO_CONSOLELOG', '1')",
            "if os.name == 'nt':",
            "    if getattr(site, 'USER_BASE', None) is None: site.USER_BASE = _HERE0",
            "    if getattr(site, 'USER_SITE', None) is None: site.USER_SITE = _HERE0",
            "    _oj = ntpath.join",
            "    ntpath.join = os.path.join = lambda a, *q: _oj(a if a is not None else _HERE0, *[x for x in q if x is not None])",
            "    if hasattr(os, 'add_dll_directory'):",
            "        for _d in ('', 'share/sdl2/bin', 'share/glew/bin', 'share/angle/bin'):",
            "            _p = _oj(_HERE0, _d) if _d else _HERE0",
            "            if os.path.isdir(_p):",
            "                try: os.add_dll_directory(_p)",
            "                except Exception: pass",
            ""
        ])
        idx = m.find("from kivy.app import App")
        if idx != -1:
            m = header + m[idx:]
        elif "_HERE0 =" not in m:
            m = header + m

        m = m.replace("from typing import Any, Dict, List\n", "from typing import Any, Dict, List, Optional\n")

        if "has_fa = any(ord(c) > 1500" not in m:
            m = m.replace(
                "return TextInput(hint_text=hint,",
                "has_fa = any(ord(c) > 1500 for c in str(hint))\n    return TextInput(hint_text=fa(hint) if has_fa else str(hint), halign='right' if has_fa else 'left',",
                1
            )

        gui_log_cls = "\n".join([
            "class GuiLogHandler(logging.Handler):",
            "    def __init__(self, app):",
            "        super().__init__(logging.INFO)",
            "        self.app = app",
            "        self.setFormatter(logging.Formatter('%(message)s'))",
            "",
            "    def emit(self, r):",
            "        try:",
            "            msg = self.format(r).strip()",
            "            if not msg or any(x in msg for x in ('Traceback', 'HTTP', '{', '}', '[', ']', 'DEBUG', 'urllib3', 'Starting', 'Cycle')):",
            "                return",
            "            if 'NEW_ORDER' in msg:",
            "                self.app.ui(lambda: self.app.log('سفارش جدید ثبت شد.', 'ok'))",
            "            elif 'CANCEL' in msg:",
            "                self.app.ui(lambda: self.app.log('یک سفارش لغو شد.', 'err'))",
            "            elif 'export' in msg.lower() or 'prices_export.csv' in msg:",
            "                self.app.ui(lambda: self.app.log('فایل اکسل لیست قیمت و موجودی محصولات آماده شد.', 'ok'))",
            "            elif 'report' in msg.lower() or '.xlsx' in msg or '.csv' in msg or '.html' in msg:",
            "                self.app.ui(lambda: self.app.log('فایل گزارش فروش آماده و در پوشه خروجی ذخیره شد.', 'ok'))",
            "            elif any(ord(c) > 1500 for c in msg):",
            "                kind = 'err' if r.levelno >= logging.WARNING else 'info'",
            "                self.app.ui(lambda m_=msg, k_=kind: self.app.log(m_, k_))",
            "        except Exception:",
            "            pass",
            "",
            "",
            "class ProdCard(Bg):"
        ])
        if "class GuiLogHandler" in m and "class ProdCard(Bg):" in m:
            m = m[:m.index("class GuiLogHandler")] + gui_log_cls + m[m.index("class ProdCard(Bg):") + len("class ProdCard(Bg):"):]
        elif "class ProdCard(Bg):" in m:
            m = m.replace("class ProdCard(Bg):", gui_log_cls, 1)

        if "def log(self, msg, kind=" in m and "Max retries" not in m:
            m = re.sub(
                r'    def log\(self, msg, kind="info"\):\n(?:        s_msg =.*?\n(?:            .*?\n)+)?',
                '    def log(self, msg, kind="info"):\n'
                '        s_msg = str(msg).strip()\n'
                '        if any(x in s_msg for x in ("{", "}", "Traceback", "HTTPSConnectionPool", "Max retries", "Client Error", "Server Error")):\n'
                '            if kind == "err":\n'
                '                msg = "خطا در ارتباط با سرور اسنپ‌شاپ. اینترنت یا توکن را بررسی کنید."\n'
                '            else:\n'
                '                return\n',
                m,
                count=1
            )

        if "self.bot_obj =" not in m:
            m = m.replace(
                '        self.low = int(self.cfg.get("low", 3))\n',
                '        self.low = int(self.cfg.get("low", 3))\n        self.desktop = platform != "android"\n        self.bot = self._bot_mod()\n        self.bot_obj = None\n        self._bot_log_ready = False\n',
                1
            )
        else:
            m = m.replace(
                "self.bot = self._bot_mod() if self.desktop else None",
                "self.bot = self._bot_mod()"
            )

        for start_marker in ("        # --- order alerts", "        # --- automation page"):
            if start_marker in m and "        # --- log\n" in m:
                a = m.index(start_marker)
                b_ = m.index("        # --- log\n")
                page_new = "\n".join([
                    "        # --- automation page (unified Android & Windows UI)",
                    '        self.ent_wi = inp("Seconds", str(self.cfg.get("watch_sec", 60)), input_filter="int")',
                    '        self.watch_lbl = lab("وضعیت هشدار: خاموش", MUT, 14, bold=True)',
                    '        self.watch_last = lab("", MUT, 12)',
                    '        w1 = RBtn("روشن کردن هشدار سفارش جدید", (0.30, 0.85, 0.50, 1))',
                    "        w1.color = (0.04, 0.12, 0.07, 1)",
                    "        w1.bind(on_release=lambda *_: self.start_watch())",
                    '        w2 = RBtn("خاموش کردن هشدار", (0.80, 0.26, 0.26, 1))',
                    "        w2.bind(on_release=lambda *_: self.stop_watch())",
                    "        cards_auto = [card(",
                    '            "هشدار سفارش جدید", lab("هر چند ثانیه بررسی شود", MUT, 12), self.ent_wi,',
                    "            self.watch_lbl, self.watch_last, w1, w2)]",
                    "        if self.bot is not None:",
                    '            self.bot_lbl = lab("وضعیت ربات: خاموش", MUT, 14, bold=True)',
                    '            bb1 = RBtn("روشن کردن ربات هوشمند", (0.30, 0.85, 0.50, 1))',
                    "            bb1.color = (0.04, 0.12, 0.07, 1)",
                    "            bb1.bind(on_release=lambda *_: self.start_bot())",
                    '            bb2 = RBtn("خاموش کردن ربات", (0.80, 0.26, 0.26, 1))',
                    "            bb2.bind(on_release=lambda *_: self.stop_bot())",
                    '            self.dry_btn = RBtn("", ACC2)',
                    "            self._dry_text()",
                    "            self.dry_btn.bind(on_release=lambda *_: self.toggle_dry())",
                    '            bb3 = RBtn("دریافت فایل اکسل محصولات و قیمت‌ها", ACC2)',
                    "            bb3.bind(on_release=lambda *_: self.bot_export())",
                    '            bb4 = RBtn("دریافت گزارش فروش (اکسل)", ACC2)',
                    "            bb4.bind(on_release=lambda *_: self.bot_report())",
                    '            bb5 = RBtn("باز کردن پوشه فایل‌های خروجی", ACC2)',
                    "            bb5.bind(on_release=lambda *_: self.open_folder())",
                    "            cards_auto.extend([",
                    '                card("ربات هوشمند پس‌زمینه", self.bot_lbl, bb1, bb2,',
                    '                     lab("اعلام صوتی سفارش جدید، بروزرسانی خودکار قیمت و موجودی از اکسل و ساخت گزارش فروش روزانه.", MUT, 11)),',
                    '                card("مدیریت گروهی قیمت و موجودی (اکسل)", self.dry_btn, bb3,',
                    '                     lab("۱) فایل اکسل محصولات را دریافت کنید. ۲) قیمت یا موجودی را ویرایش و با نام prices.csv ذخیره کنید.", MUT, 11)),',
                    '                card("گزارش‌ها و فایل‌های خروجی", bb4, bb5)])',
                    '            if os.name == "nt":',
                    '                self.win_btn = RBtn("", ACC2)',
                    "                self._win_text()",
                    "                self.win_btn.bind(on_release=lambda *_: self.toggle_winstart())",
                    '                cards_auto.append(card("اجرای خودکار در ویندوز", self.win_btn,',
                    '                                       lab("اجرای خودکار برنامه به صورت Minimize هنگام روشن شدن ویندوز.", MUT, 11)))',
                    '        self._add("auto", page(*cards_auto))',
                    "",
                    ""
                ])
                m = m[:a] + page_new + m[b_:]
                break

        m = m.replace('("هشدار" if not self.desktop else "ربات", "auto")', '("ربات و هشدار", "auto")')
        m = m.replace('("هشدار", "auto")', '("ربات و هشدار", "auto")')

        if 'self.cfg.get("bot_on")' not in m:
            m = m.replace(
                '        self.log("آماده است.")\n        return root\n',
                '        self.log("آماده است.")\n        if self.bot and self.cfg.get("bot_on") and self.cfg.get("ua") and self.cfg.get("token") and self.cfg.get("vid"):\n            Clock.schedule_once(lambda dt: self.start_bot(), 2)\n        if os.name == "nt" and "--minimized" in sys.argv:\n            Clock.schedule_once(lambda dt: self._minimize(), 3)\n        return root\n',
                1
            )

        bot_methods = "\n".join([
            "    def _bot_mod(self):",
            "        try:",
            '            os.environ.setdefault("SNAPP_BOT_DIR", self.out_dir())',
            "            import bot",
            "            return bot",
            "        except Exception:",
            "            return None",
            "",
            "    def _bot_cfg(self):",
            "        cfg = dict(self.bot.DEFAULT)",
            "        cfg.update(self.bot.jload(self.bot.CFG, {}))",
            '        cfg.update({"user_agent": self.ent_ua.text.strip(), "token": self.ent_token.text.strip(),',
            '                    "vendor_id": self.ent_vid.text.strip()})',
            "        return cfg",
            "",
            "    def _attach_bot_log(self):",
            "        if self._bot_log_ready:",
            "            return",
            '        lg = logging.getLogger("bot")',
            "        lg.setLevel(logging.INFO)",
            "        lg.addHandler(GuiLogHandler(self))",
            "        try:",
            '            fh = RotatingFileHandler(os.path.join(self.out_dir(), "bot.log"), maxBytes=1_000_000, backupCount=3, encoding="utf-8")',
            '            fh.setFormatter(logging.Formatter("%(asctime)s %(levelname)s %(message)s"))',
            "            lg.addHandler(fh)",
            "        except Exception:",
            "            pass",
            "        self._bot_log_ready = True",
            "",
            "    def _bot_label(self, on):",
            "        if hasattr(self, 'bot_lbl'):",
            '            self.bot_lbl.text = fa("وضعیت ربات: فعال" if on else "وضعیت ربات: خاموش")',
            "            self.bot_lbl.color = GRN if on else MUT",
            "",
            "    def start_bot(self):",
            "        if not self.bot or self.bot_obj is not None:",
            "            return",
            "        if not self._need_vid():",
            "            return",
            "        self._attach_bot_log()",
            "        b = self.bot.Bot(self._bot_cfg())",
            "        self.bot_obj = b",
            '        self.cfg["bot_on"] = True',
            "        self._save()",
            "        self._bot_label(True)",
            '        self.log("ربات پس‌زمینه فعال شد.", "ok")',
            "        def run():",
            "            rc = None",
            "            try:",
            "                rc = b.run()",
            "            except Exception:",
            '                self.ui(lambda: self.log("خطا در اجرای ربات پس‌زمینه.", "err"))',
            "            def done():",
            "                if self.bot_obj is b:",
            "                    self.bot_obj = None",
            "                    self._bot_label(False)",
            "                if rc == 2:",
            '                    self.log("توکن معتبر نیست؛ ربات متوقف شد.", "err")',
            "            self.ui(done)",
            "        threading.Thread(target=run, daemon=True).start()",
            "",
            "    def stop_bot(self):",
            "        if self.bot_obj is not None:",
            "            self.bot_obj.stop()",
            "            self.bot_obj = None",
            '        self.cfg["bot_on"] = False',
            "        self._save()",
            "        self._bot_label(False)",
            '        self.log("ربات متوقف شد.")',
            "",
            "    def _dry_text(self):",
            "        if hasattr(self, 'dry_btn') and self.bot:",
            '            dry = bool(self.bot.jload(self.bot.CFG, {}).get("prices_dry_run", True))',
            '            self.dry_btn.set_text("حالت بروزرسانی قیمت: " + ("آزمایشی (بدون اعمال در سایت)" if dry else "فعال (اعمال مستقیم در اسنپ‌شاپ)"))',
            "",
            "    def toggle_dry(self):",
            "        if not self.bot:",
            "            return",
            "        c = self.bot.jload(self.bot.CFG, {})",
            '        c["prices_dry_run"] = not c.get("prices_dry_run", True)',
            "        self.bot.jsave(self.bot.CFG, c)",
            "        self._dry_text()",
            '        self.log("حالت بروزرسانی قیمت به " + ("«آزمایشی»" if c["prices_dry_run"] else "«اعمال مستقیم در سایت»") + " تغییر کرد.", "ok")',
            "",
            "    def _win_text(self):",
            "        if hasattr(self, 'win_btn'):",
            '            self.win_btn.set_text("اجرای خودکار با روشن شدن ویندوز: " + ("فعال" if self.cfg.get("winstart") else "غیرفعال"))',
            "",
            "    def toggle_winstart(self):",
            '        on = not self.cfg.get("winstart")',
            '        if on and not getattr(sys, "frozen", False):',
            '            self.log("این قابلیت فقط در فایل اجرایی ویندوز (EXE) فعال می‌شود.", "err")',
            "            return",
            "        try:",
            "            self.bot.startup(on)",
            "        except Exception:",
            '            self.log("خطا در تغییر تنظیمات استارت‌آپ ویندوز.", "err")',
            "            return",
            '        self.cfg["winstart"] = on',
            "        self._save()",
            "        self._win_text()",
            '        self.log("اجرای خودکار با ویندوز " + ("فعال شد." if on else "غیرفعال شد."), "ok")',
            "",
            "    def bot_export(self):",
            "        if not self.bot or not self._need_vid():",
