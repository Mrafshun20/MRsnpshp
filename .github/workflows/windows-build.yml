name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Restore and patch logic.py and main.py
      run: |
        python -c "import pathlib, py_compile; l = pathlib.Path('logic_v3_unused.py').read_text(encoding='utf-8'); l = l.replace('BBK = [\"isbuybox\", \"hasbuybox\", \"buybox\",', 'BBK = [\"isbuybox\", \"hasbuybox\",').replace('COMPK = [\"lowestprice\",', 'COMPK = [\"buybox\", \"lowestprice\",'); l += '\n\ndef event_line(e):\n    return str(e.get(\"event_type\",\"EVENT\")) + \" | \" + str(e.get(\"order_number\",\"\"))\n'; pathlib.Path('logic.py').write_text(l, encoding='utf-8'); m = pathlib.Path('main_v3_unused.py').read_text(encoding='utf-8'); hdr = '# -*- coding: utf-8 -*-\nimport csv, datetime, json, ntpath, os, re, shutil, site, sys, threading, time\nHERE = getattr(sys, \"_MEIPASS\", os.path.dirname(os.path.abspath(__file__)))\nif getattr(site, \"USER_BASE\", None) is None: site.USER_BASE = HERE\nif getattr(site, \"USER_SITE\", None) is None: site.USER_SITE = HERE\n_orig_join = ntpath.join\ndef _safe_join(a, *p): return _orig_join(a if a is not None else HERE, *[x for x in p if x is not None])\nntpath.join = os.path.join = _safe_join\nif hasattr(os, \"add_dll_directory\"):\n    for _d in (\"\", \"share\\\\sdl2\\\\bin\", \"share\\\\glew\\\\bin\", \"share\\\\angle\\\\bin\"):\n        _p = _orig_join(HERE, _d) if _d else HERE\n        if os.path.isdir(_p):\n            try: os.add_dll_directory(_p)\n            except Exception: pass\nif sys.stdout is None: sys.stdout = open(os.devnull, \"w\")\nif sys.stderr is None: sys.stderr = open(os.devnull, \"w\")\nos.environ.setdefault(\"KIVY_NO_CONSOLELOG\", \"1\")\n'; m = hdr + m[m.find('from concurrent.futures'):]; m = m.replace('return TextInput(hint_text=hint,', 'has_fa = bool(re.search(\"[\\\\u0600-\\\\u06FF]\", str(hint)))\n    return TextInput(hint_text=fa(hint) if has_fa else str(hint), halign=\"right\" if has_fa else \"left\",'); pathlib.Path('main.py').write_text(m, encoding='utf-8'); py_compile.compile('logic.py', doraise=True); py_compile.compile('main.py', doraise=True); print('Both files patched and verified OK!')"

    - name: Commit repaired files back to repository
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add logic.py main.py
        git diff --staged --quiet || git commit -m "Auto-repair logic.py and main.py"
        git push || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy==2.3.0 kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle requests urllib3 idna charset-normalizer certifi arabic-reshaper python-bidi==0.4.2 future pyinstaller

    - name: Build EXE with PyInstaller
      env:
        KIVY_GL_BACKEND: angle_sdl2
        KIVY_NO_CONSOLELOG: 1
      run: |
        python -c "import sys, os, PyInstaller.__main__, kivy_deps.sdl2, kivy_deps.glew, kivy_deps.angle; share = os.path.join(sys.prefix, 'share'); bins = [f'--add-binary={p};.' for p in (kivy_deps.sdl2.dep_bins + kivy_deps.glew.dep_bins + kivy_deps.angle.dep_bins) if os.path.isdir(p)]; PyInstaller.__main__.run(['--noconfirm', '--onefile', '--windowed', '--add-data=DejaVuSans.ttf;.', '--add-data=DejaVuSans-Bold.ttf;.', f'--add-data={share};share', *bins, '--hidden-import=logic', '--hidden-import=kivy_deps.sdl2', '--hidden-import=kivy_deps.glew', '--hidden-import=kivy_deps.angle', 'main.py'])"

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SnappShop-Windows-App
        path: dist/main.exe
