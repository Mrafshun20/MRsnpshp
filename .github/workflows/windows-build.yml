        # =====================================================================
        # 3. Fix main.py
        # =================================================0====================
        p_main = pathlib.Path("main.py")
        m = p_main.read_text(encoding="utf-8").replace("\r\n", "\n")

        # Clean old broken tail if exists
        cut_marker = "# ---- desktop bot (runs bot.Bot in a background thread)"
        if cut_marker in m:
            m = m[:m.index(cut_marker)]
