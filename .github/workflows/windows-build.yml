                p_spec.write_text(sp_txt, encoding="utf-8")

        for f in ("main.py", "logic.py", "core.py", "bot.py"):
            py_compile.compile(f, doraise=True)
        print("ALL_FILES_VERIFIED_OK")

    - name: Commit unified files to repository
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add main.py logic.py bot.py buildozer.spec
        git diff --staged --quiet || (git commit -m "Fix syntax errors and integrate desktop bot" && git push) || true

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install kivy==2.3.0 kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle requests urllib3 idna charset-normalizer certifi arabic-reshaper python-bidi==0.4.2 future pyinstaller

    - name: Build Windows EXE
      shell: python
      env:
        KIVY_GL_BACKEND: angle_sdl2
        KIVY_NO_CONSOLELOG: 1
      run: |
        import sys, os, PyInstaller.__main__, kivy_deps.sdl2, kivy_deps.glew, kivy_deps.angle
        share = os.path.join(sys.prefix, "share")
        bins = [f"--add-binary={p};." for p in (kivy_deps.sdl2.dep_bins + kivy_deps.glew.dep_bins + kivy_deps.angle.dep_bins) if os.path.isdir(p)]
        PyInstaller.__main__.run([
            "--noconfirm", "--onefile", "--windowed",
            "--name=SnappShop",
            "--icon=icon.png",
            "--add-data=DejaVuSans.ttf;.",
            "--add-data=DejaVuSans-Bold.ttf;.",
            "--add-data=icon.png;.",
            f"--add-data={share};share",
            *bins,
            "--hidden-import=logic",
            "--hidden-import=core",
            "--hidden-import=bot",
            "--hidden-import=kivy_deps.sdl2",
            "--hidden-import=kivy_deps.glew",
            "--hidden-import=kivy_deps.angle",
            "main.py"
        ])

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnappShop-Windows-App
        path: dist/SnappShop.exe

    - name: Publish EXE to Releases (direct download)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest build
        files: dist/SnappShop.exe
        
