name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Unify logic.py, bot.py, main.py, and buildozer.spec
      shell: python
      run: |
        import ast, pathlib, py_compile

        # =====================================================================
        # 1. Fix logic.py (Persian headers + missing bot.py helpers & Prod attrs)
        # =====================================================================
        p_logic = pathlib.Path("logic.py")
        lg = p_logic.read_text(encoding="utf-8").replace("\r\n", "\n")

