name: Build Windows App

on:
  push:
    branches: [ main, master ]
    paths: [ "main.py", "logic.py", "core.py", "bot.py", "build_windows.py", ".github/workflows/windows-build.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kivy==2.3.0 kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle certifi arabic-reshaper python-bidi==0.4.2 future pyinstaller

      - name: Build EXE with PyInstaller
        env:
          KIVY_GL_BACKEND: angle_sdl2
          KIVY_NO_CONSOLELOG: 1
        run: python build_windows.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SnappShop-Windows-App
          path: dist/SnappShop.exe

      - name: Publish EXE to Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: dist/SnappShop.exe
          
