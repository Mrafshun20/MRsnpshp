            new_rw_mins = '''def read_mins_csv(path: str) -> Dict[str, float]:
    import csv
    out: Dict[str, float] = {}
    with open(path, newline="", encoding="utf-8-sig") as f:
        rows = list(csv.reader(f))
    if not rows:
        return out
    head = [str(h).strip().lower() for h in rows[0]]
    si = next((i for i, h in enumerate(head) if "sku" in h or "کد" in h or "شناسه" in h), 0)
    mi = next((i for i, h in enumerate(head) if "min" in h or "حداقل" in h or "کف" in h), None)
    if mi is None:
        mi = len(head) - 1 if len(head) > 1 else 0
    for r in rows[1:]:
        if len(r) <= max(si, mi):
            continue
        v = to_num(r[mi])
        if r[si].strip() and v is not None and v > 0:
            out[r[si].strip()] = v
    return out


def write_mins_csv(path: str, products: List[Prod], mins: Dict[str, float]):
    import csv
    with open(path, "w", newline="", encoding="utf-8-sig") as f:
        w = csv.writer(f)
        w.writerow(["کد کالا (SKU)", "نام کالا", "قیمت فعلی (تومان)", "قیمت نفر اول (تومان)", "حداقل قیمت مجاز (تومان)"])
        for o in products:
            w.writerow([o.sku, o.name, "" if o.price is None else int(o.price),
                        "" if o.comp is None else int(o.comp), "" if o.sku not in mins else int(mins[o.sku])])
'''
            lg = lg[:s_m] + new_rw_mins

        new_bsw = '''def build_sales_workbook(orders: List[dict], prods: Optional[List[Prod]] = None, low_stock: int = 3) -> bytes:
    cols, rows = sales_rows(orders)
    head = {}
    used = set()
    for c in cols:
        h = fa_header(c)
        if h in used and h != c:
            h = f"{h} ({c.split('.')[-1]})"
        used.add(h)
        head[c] = h
    drows = [{head[c]: r.get(c) for c in cols} for r in rows]
    sku_rows, day_rows = sales_summary(orders)
    sheets = [
