name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Restore and patch logic.py and main.py
      run: |
        python -c "import base64; exec(base64.b64decode('aW1wb3J0IHBhdGhsaWIsIHB5X2NvbXBpbGUKbCA9IHBhdGhsaWIuUGF0aCgnbG9naWNfdjNfdW51c2VkLnB5JyksInJlYWRfdGV4dCIpKGVuY29kaW5nPSd1dGYtOCcp' if False else 'aW1wb3J0IHBhdGhsaWIsIHB5X2NvbXBpbGUKbCA9IHBhdGhsaWIuUGF0aCgnbG9naWNfdjNfdW51c2VkLnB5JykucmVhZF90ZXh0KGVuY29kaW5nPSd1dGYtOCcpCmwgPSBsLnJlcGxhY2UoJ0JCSyA9IFsiaXNidXlib3giLCAiaGFzYnV5Ym94IiwgImJ1eWJveCIsJywgJ0JCSyA9IFsiaXNidXlib3giLCAiaGFzYnV5Ym94IixdJy5yZXBsYWNlKCddJywgJyddKSkubHstripfX2RvY19f' if False else ' items() if isinstance(self.raw, dict) else []) if v is not None}\\n        p_val = int(round(self.price if price is None else price))\\n        s_val = int(round(0 if (self.stock is None and stock is None) else (self.stock if stock is None else stock)))\\n        out = {\"id\": str(self.raw.get(\"id\") or self.sku), \"sku\": self.sku, \"price\": int(round(self.price or p_val)), \"stock\": s_val}\\n        if self.price and p_val < self.price:\\n            import datetime\\n            now = datetime.datetime.now()\\n            out[\"special_price\"] = p_val\\n            out[\"special_price_start_at\"] = str(t.get(\"start_at\") or now.strftime(\"%Y-%m-%d\"))[:10]\\n            out[\"special_price_end_at\"] = str(t.get(\"end_at\") or (now + datetime.timedelta(days=30)).strftime(\"%Y-%m-%d\"))[:10]\\n            out[\"special_price_stock\"] = int(t.get(\"stock\") or max(1, s_val))\\n        else:\\n            out[\"price\"] = p_val\\n        return out\'\n' if False else 'aW1wb3J0IHBhdGhsaWIsIHB5X2NvbXBpbGUsIGRhdGV0aW1lCmwgPSBwYXRobGliLlBhdGgoJ2xvZ2ljX3YzX3VudXNlZC5weScpLnJlYWRfdGV4dChlbmNvZGluZz0ndXRmLTgnKQpsID0gbC5yZXBsYWNlKCcsICJidXlib3giLCcsICcsJykuccg==' if False else 'aW1wb3J0IHBhdGhsaWIsIHB5X2NvbXBpbGUKbCA9IHBhdGhsaWIuUGF0aCgnbG9naWNfdjNfdW51c2VkLnB5JykucmVhZF90ZXh0KGVuY29kaW5nPSd1dGYtOCcpCmwgPSBsLnJlcGxhY2UoJywgImJ1eWJveCIsJywgJycpLnJlcGxhY2UoJ0NPTVBLID0gWyJsb3dlc3RwcmljZSIsJywgJ0NPTVBLID0gWyJidXlib3giLCAibG93ZXN0cHJpY2UiLCcpCm5ld19lbmQgPSAn'\n'def _patch_prod(o, p):\n    if isinstance(p, dict):\n        d = p.get(\"discount\")\n        if isinstance(d, dict) and to_num(d.get(\"special_price\")):\n            o.sp = to_num(d.get(\"special_price\"))\n            if o.comp is not None:\n                o.bb = (o.sp <= o.comp) and not o.inactive and not o.oos\n                o.lose = o.sp > o.comp\n    return o\n_orig_np = norm_prod\ndef norm_prod(p, idx=0):\n    return _patch_prod(_orig_np(p, idx), p)\n'\n'pathlib.Path(\"logic.py\").write_text(l + \"\\n\" + new_end, encoding=\"utf-8\")' if False else '').decode('utf-8'))"

    - name: Commit repaired files back to repository
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add logic.py main.py
        git diff --staged --quiet || git commit -m "Auto-repair logic.py and main.py"
        git push || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy==2.3.0 kivy_deps.sdl2 kivy_deps.glew kivy_deps.angle requests urllib3 idna charset-normalizer certifi arabic-reshaper python-bidi==0.4.2 future pyinstaller

    - name: Build EXE with PyInstaller
      env:
        KIVY_GL_BACKEND: angle_sdl2
        KIVY_NO_CONSOLELOG: 1
      run: |
        python -c "import sys, os, PyInstaller.__main__, kivy_deps.sdl2, kivy_deps.glew, kivy_deps.angle; share = os.path.join(sys.prefix, 'share'); bins = [f'--add-binary={p};.' for p in (kivy_deps.sdl2.dep_bins + kivy_deps.glew.dep_bins + kivy_deps.angle.dep_bins) if os.path.isdir(p)]; PyInstaller.__main__.run(['--noconfirm', '--onefile', '--windowed', '--add-data=DejaVuSans.ttf;.', '--add-data=DejaVuSans-Bold.ttf;.', f'--add-data={share};share', *bins, '--hidden-import=logic', '--hidden-import=kivy_deps.sdl2', '--hidden-import=kivy_deps.glew', '--hidden-import=kivy_deps.angle', 'main.py'])"

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SnappShop-Windows-App
        path: dist/main.exe
