            m = m[:m.index("def on_pause(self):")]

        clean_class_tail = '''    def _bot_mod(self):
        os.environ.setdefault("SNAPP_BOT_DIR", self.out_dir())
        import bot
        return bot

    def _bot_cfg(self):
        b = self._bot_mod()
        cfg = dict(b.DEFAULT)
        cfg.update(b.jload(b.CFG, {}))
        cfg.update({
            "user_agent": self.ent_ua.text.strip(),
            "token": self.ent_token.text.strip(),
            "vendor_id": self.ent_vid.text.strip(),
        })
        return cfg

    def _attach_bot_log(self):
        if getattr(self, "_bot_log_ready", False):
            return
        lg = logging.getLogger("bot")
        lg.setLevel(logging.INFO)
        lg.addHandler(GuiLogHandler(self))
        self._bot_log_ready = True

    def bot_export(self):
        if not self._need_vid():
            return
        self._attach_bot_log()
        self.go("log")
        self.log("در حال دریافت لیست محصولات و ساخت فایل اکسل...")
        def _do():
            b = self._bot_mod()
            b.Bot(self._bot_cfg()).export_products()
            if platform == "android":
                self.save_shared(b.EXPORT)
        self._run(_do)

    def bot_report(self):
        if not self._need_vid():
            return
        self._attach_bot_log()
        self.go("log")
        self.log("در حال آماده‌سازی گزارش فروش و لیست کالاهای رو به اتمام...")
        def _do():
            b = self._bot_mod()
            b.Bot(self._bot_cfg()).report(force=True)
        self._run(_do)

    def open_folder(self):
        d = self.out_dir()
        try:
            if os.name == "nt":
                os.startfile(d)
            elif platform == "android":
                self.log(f"مسیر ذخیره فایل‌ها در گوشی:\\nDownload و {d}", "ok")
            else:
                import subprocess
                subprocess.Popen(["xdg-open", d])
        except Exception:
            self.log(f"مسیر پوشه فایل‌ها:\\n{d}", "info")

    def on_pause(self):
        return True


if __name__ == "__main__":
    SnappShopApp().run()
'''
        m = m.rstrip() + "\n\n" + clean_class_tail
        ast.parse(m)
        p_main.write_text(m, encoding="utf-8")

        # =====================================================================
        # 4. buildozer.spec check
