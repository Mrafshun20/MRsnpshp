name: Build Windows App

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ "buildozer.spec", ".github/workflows/build.yml", ".github/workflows/bot-windows.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller kivy==2.3.0 arabic-reshaper python-bidi==0.4.2 certifi pillow

      - name: Compile check
        run: python -m py_compile main.py logic.py core.py bot.py

      - name: Build EXE
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SnappShop \
            --add-data "DejaVuSans.ttf;." --add-data "DejaVuSans-Bold.ttf;." --add-data "icon.png;." \
            --collect-data certifi --hidden-import bot --hidden-import winsound main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SnappShop-exe
          path: dist/SnappShop.exe

      - name: Publish EXE to Releases (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: Latest Windows build
          files: dist/SnappShop.exe
